<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Searchify</title>
    <link rel="stylesheet" href="lost&found.css">
</head>

<body>
    <header class="site-header">
        <div class="header-container">
            <nav class="nav-bar">
                <div class="logo-title">
                    <img src="assets/Searchify-Logo-removebg-preview.png" alt="" width="140">
                    <h2>Searchify</h2>
                </div>

                <div class="nav-buttons">
                    <button type="button" class="buttons">Home</button>
                    <button type="button" class="buttons">Browse Items</button>
                    <button type="button" class="buttons">Report Lost</button>
                    <button type="button" class="buttons">Report Found</button>
                </div>

                <div class="login">
                    <button type="button" class="signin-btn">Sign In</button>
                </div>
            </nav>
        </div>
    </header>

    <div class="hero-container">
        <div class="hero">
            <h1 class="hero-title">Lost Something On Campus?</h1>
            <p class="hero-subtitle">Find your belongings quickly using my smart Lost &amp; Found Portal.</p>
            <input type="text" placeholder="Search by item name, category or location..." class="search-btn">

            <div class="hero-btns">
                <button type="button" class="hero-btn1">Report Lost</button>
                <button type="button" class="hero-btn2">Report Found</button>
            </div>

        </div>
        <div>
            <img src="assets/Items-illustration1.png" alt="" width="450">
        </div>
    </div>

    <section class="stats-section">

        <h2 class="stats-heading">Portal Statistics</h2>
        <p class="stats-subheading">Helping Students Reconnect With Their Belongings</p>

        <div class="card-container">
            <div class="card">
                <p class="c1">152</p>
                <p class="c2">Lost Items</p>
            </div>
            <div class="card">
                <p class="c1">95</p>
                <p class="c2">Found Items</p>
            </div>
            <div class="card">
                <p class="c1">89%</p>
                <p class="c2">Success Rate</p>
            </div>
            <div class="card">
                <p class="c1">500+</p>
                <p class="c2">Active User</p>
            </div>
        </div>

    </section>

    <section class="lost-section">

        <h2 class="lost-heading">Recently Lost Items</h2>

        <div class="lost-container">
            <div class="lost-card">
                a
            </div>
            <div class="lost-card">
                b
            </div>
            <div class="lost-card">
                c
            </div>
            <div class="lost-card">
                d
            </div>
        </div>
    </section>

</body>

</html>
